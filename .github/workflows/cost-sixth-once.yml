name: Authorized sixth cost verification

on:
  push:
    branches: [master]
    paths:
      - .github/COST_RUN_SIXTH

permissions:
  contents: read

concurrency:
  group: cost-measurement
  cancel-in-progress: false

jobs:
  measure-juice-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    env:
      STS_BACKEND_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://securetotalscan-api-production.up.railway.app' }}
      STS_SERVICE_TOKEN: ${{ secrets.STS_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run exactly the sixth authorized deep scan
        run: |
          test -n "$STS_SERVICE_TOKEN" || { echo "::error::STS_SERVICE_TOKEN missing"; exit 1; }
          python backend/cost_harness.py             --fixture-id vuln-juice-shop             --skip-surface             --timeout 900             --out cost-results-sixth.json             --markdown-out cost-results-sixth.md
      - name: Publish
        if: always()
        run: |
          echo "## Sixth authorized cost run: OWASP Juice Shop" >> "$GITHUB_STEP_SUMMARY"
          cat cost-results-sixth.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: securetotalscan-cost-sixth
          path: |
            cost-results-sixth.json
            cost-results-sixth.md
          retention-days: 90
