name: Secret Scan

# Scans every commit on every branch for credentials with gitleaks.
#
# This repository is public, so the job log is public too: --redact keeps any
# matched value out of the log. Findings are reported by commit, file, line and
# rule only.
#
# A finding cannot be fixed by deleting the line: the value stays in history.
# Rotate the credential first, then add the finding's fingerprint to
# .gitleaksignore with a note saying when it was rotated.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Run gitleaks over all refs
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --log-opts="--all" --redact --verbose --exit-code 1
