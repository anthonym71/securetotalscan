# Deploy to Railway + Vercel after CI passes on master.
#
# Configure a GitHub Environment named "prod" (Settings → Environments)
# and add these secrets there (repository secrets also work as fallback):
#
# Deploy tokens (required):
#   RAILWAY_TOKEN  — Project token for the production environment (Railway project
#                    → Settings → Tokens). Do NOT use an account token here and
#                    do NOT run `railway link` with a project token.
#   VERCEL_TOKEN   — https://vercel.com/account/tokens
#
# Backend API keys (synced to Railway on each backend deploy):
#   OPENROUTER_API_KEY, GIT_TOKEN, NVD_API_KEY, ABUSEIPDB_API_KEY,
#   ALERT_WEBHOOK_URL, ALERT_WEBHOOK_SECRET
#   Note: name the GitHub secret GIT_TOKEN (not GITHUB_TOKEN — that name is
#   reserved for the automatic Actions CI token).
#
# Frontend API keys (synced to Vercel production on each frontend deploy):
#   GHL_API_TOKEN, GHL_LOCATION_ID, RESEND_API_KEY, REPORT_FROM_EMAIL,
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN,
#   ALERT_WEBHOOK_URL, ALERT_WEBHOOK_SECRET,
#   DATABASE_URL, DATABASE_URL_UNPOOLED
#
# Neon issues two connection strings and both are needed. DATABASE_URL is the
# pooled one used at runtime; DATABASE_URL_UNPOOLED is the direct one that
# migrations use, because the pooler does not carry DDL or advisory locks
# reliably. Migrations run as their own CD job before the frontend deploys —
# a build that ships code expecting a column the database does not have yet is
# an outage, so the order matters. That job is triggered by changes under
# migrations/ as well as by a frontend deploy, because a migration-only change
# would otherwise sail through CD without being applied.
#
# Alerting (docs/ALERTING.md) has three senders and therefore needs the same
# pair in three places: Vercel (web-tier failures), Railway (backend failures)
# and the `prod` GitHub environment itself, which .github/workflows/health-check.yml
# reads directly. The GitHub environment is the source for all three — the two
# sync steps below carry it to the other two platforms.
#
# Optional repository variables (Settings → Variables):
#   RAILWAY_PROJECT_ID, RAILWAY_SERVICE_ID, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
#   NEXT_PUBLIC_API_URL, SITE_URL

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: true

env:
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || '224ad38c-41fc-40c3-9da8-afe1dac9a668' }}
  RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID || 'securetotalscan-api' }}
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_x0HywmHRlyGlzeUAlcsAIsYY' }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_LzgIUHdMQXzfOfy1icfyrNHkdK3v' }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://securetotalscan-api-production.up.railway.app' }}

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.targets.outputs.backend }}
      frontend: ${{ steps.targets.outputs.frontend }}
      migrations: ${{ steps.targets.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect deploy targets
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only HEAD^ HEAD)"
          echo "Changed files:"
          echo "$files"

          backend=false
          frontend=false
          migrations=false

          # CD workflow or sync script changes → redeploy both + refresh env secrets
          if echo "$files" | grep -qE '^\.github/workflows/cd\.yml$|^scripts/sync-(railway|vercel)-env\.sh$'; then
            backend=true
            frontend=true
          fi

          if echo "$files" | grep -qE '^backend/'; then
            backend=true
          fi

          if echo "$files" | grep -qE '^(app/|components/|lib/|public/|package\.json|package-lock\.json|next\.config|tailwind\.config|postcss\.config|tsconfig|middleware\.|eslint\.config|vercel\.json|scripts/vercel-ignore\.sh)'; then
            frontend=true
          fi

          # The migration runner and the SQL it applies. Neither of these paths
          # is a frontend path, which is how PR #128 — a fix to the migration
          # runner itself — produced a green CD run that deployed nothing and
          # migrated nothing. The pipeline reported success for doing no work.
          if echo "$files" | grep -qE '^migrations/|^scripts/migrate\.ts$'; then
            migrations=true
          fi

          # A frontend deploy always migrates first: shipping code that expects
          # a column the database does not have is the outage this ordering
          # exists to prevent.
          if [ "$frontend" = "true" ]; then
            migrations=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "Deploy backend=$backend frontend=$frontend migrations=$migrations"

  deploy-backend:
    name: Railway
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sync API keys to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing RAILWAY_TOKEN — add it to Settings → Environments → prod → Secrets"
            exit 1
          fi
          bash ../scripts/sync-railway-env.sh

      - name: Deploy backend to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash ../scripts/sync-railway-env.sh --deploy

  # Migrations are their own job, not a step inside the Vercel deploy.
  #
  # As a step they only ran when a frontend path changed, so a pull request
  # that touched nothing but `migrations/` or the migration runner passed CD
  # green without applying anything — which is exactly what happened to #128.
  # As a job they run whenever the database changed, and the frontend deploy
  # waits for them.
  migrate:
    name: Migrate
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          # `-z` on the concatenation, because GitHub sets an env var to the
          # empty string when the secret behind it does not exist — so testing
          # either one alone says "set" for a variable holding nothing.
          if [ -z "${DATABASE_URL_UNPOOLED}${DATABASE_URL}" ]; then
            echo "::warning::No database connection string in this environment — skipping migrations. Set DATABASE_URL and DATABASE_URL_UNPOOLED as secrets in the GitHub 'prod' environment."
            exit 0
          fi
          npm ci
          npm run migrate

  deploy-frontend:
    name: Vercel
    # Migrations run before the deploy, never after. Code that expects a column
    # the database does not have yet is an outage; a database that has a column
    # the code does not use yet is nothing at all. `needs` is what enforces the
    # order — and it also means a failed migration stops the deploy.
    needs: [changes, migrate]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync API keys to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN — add it to Settings → Environments → prod → Secrets"
            exit 1
          fi
          bash scripts/sync-vercel-env.sh

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@54.13.0 deploy --prod --yes --force --token="$VERCEL_TOKEN"
